name: Tests

# The logic that decides what a memory is — clustering, scoring, time windows, origin
# detection — is pure functions. Proving them here takes seconds; proving them through the
# simulator lane takes about twelve minutes, and every bug found in this project so far was
# the kind a unit test catches instantly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 Scripts/pick_simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Hidden.xcodeproj \
            -scheme Hidden \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:HiddenTests \
            -derivedDataPath .build \
            -resultBundlePath TestResult.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | tail -n 40

      # A crashed test process names no expectation; the result bundle carries the crash
      # log, and diagnosing it from Windows means having the bundle in hand.
      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-result-bundle
          path: TestResult.xcresult
          retention-days: 7

      # To stdout as well as the summary. A compile error in a test target reports its file
      # and line in the full log and only its message in the tail, which is the half that is
      # no use for fixing it.
      - name: Report failures
        if: failure()
        run: |
          echo "--- errors ---"
          grep -E "error:" test.log | sort -u | head -n 60 || true
          echo "--- failing expectations ---"
          grep -E "(recorded an issue|Expectation failed)" test.log | sort -u | head -n 60 || true
          # A crashed test process names no expectation at all; the fatal message and the
          # frames around it are the only diagnosis there is.
          echo "--- crash context ---"
          grep -B5 -A25 -E "(Fatal error|Precondition failed|signal SIG|Restarting after unexpected)" test.log | head -n 120 || true
          {
            echo "## Failing tests"
            echo '```'
            grep -E "(error:|recorded an issue|Expectation failed)" test.log | sort -u | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
