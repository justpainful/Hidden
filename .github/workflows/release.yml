name: Release (signed)

# Manually triggered. Produces a signed archive suitable for TestFlight, and only when the
# signing secrets exist — a plain CI build never needs them.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   BUILD_CERTIFICATE_BASE64   — a .p12 distribution certificate, base64-encoded
#   P12_PASSWORD               — the certificate's password
#   BUILD_PROVISION_PROFILE_BASE64 — the .mobileprovision, base64-encoded
#   KEYCHAIN_PASSWORD          — any throwaway password for the temporary CI keychain
#   APPLE_TEAM_ID              — the ten-character team identifier
#
# Nothing is hardcoded here; without the secrets the workflow fails early and loudly.

on:
  workflow_dispatch:

jobs:
  archive:
    name: Signed archive
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Check the secrets exist
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "$CERT" ] && missing="$missing BUILD_CERTIFICATE_BASE64"
          [ -z "$PROFILE" ] && missing="$missing BUILD_PROVISION_PROFILE_BASE64"
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — see the comment at the top of release.yml"
            exit 1
          fi

      - name: Install certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/ci.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Hidden.xcodeproj \
            -scheme Hidden \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath Hidden.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            2>&1 | tail -n 60

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Hidden-archive
          path: Hidden.xcarchive
          retention-days: 14
